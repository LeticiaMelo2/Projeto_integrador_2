<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../static/styles.css">
    <title>Cadastro</title>
</head>
<body>
    
    <!-- menu/barra lateral -->
     <aside class = "barra-lateral">

    <div class="logo">
        Triagem+
    </div>

        <ul class = "menu">
            <li> <i class="bx bx-user-plus"></i> Cadastro  </li>
            <li> <i class="bx bx-spreadsheet"></i> Triagem </li>
            <li> <i class="bx bx-bar-chart-alt-2"></i> Relatórios </li>
            <li> <i class="bx bx-first-aid"></i> Atendimento </li>
        </ul>
     </aside>

     <main class="conteudo">
        <div class = "form">
            <div class = "form-header">
                <div class="title">
                    <h1>Cadastro do Paciente</h1>
                </div>
            </div>

        <div class="input-group" id="form1"> 
            <h2>Dados do Paciente</h2>
            <div class="input-box">

                <div class="campo campo-completo">
                <label>Nome completo *</label>
                <input id="name" type="text" placeholder="Digite o nome completo" required>
                </div>

                <div class="campo">
                <label>Data de Nascimento *</label>
                <input type="date" id="dataNascimento" required>
                </div>
                
                <div class="campo">
                <label>RG *</label>
                <input type="text" id="rg" placeholder="Digite o RG" required>
                </div>  
                
                <div class="campo">
                <label>CPF *</label>
                <input type="text" id="cpf" placeholder="Digite o CPF" required>
                </div>

                <div class="campo">
                <label>Nome da mãe *</label>
                <input type="text" id="nome-mae" placeholder="Digite o nome da mãe" required>
                </div>

                <div class="campo">
                <label>Nome do pai</label>
                <input type="text" id="nome-pai" placeholder="Digite o nome do pai">
                </div>

                <div class="campo">
                <label>Sexo</label>
                <select id="sexo" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                    <option value="nao_informar">Prefiro não informar</option>
                </select>
                </div>

                <div class="botoes">
                <button type="button" class="btn-prox" onclick="proximaEtapa()">
                    Próximo
                </button>
                </div>
            </div>
        </div>

            <div class="input-group" id="form2" style="display: none;"> 
                <h2>Dados de Contato</h2>
                <div class="input-box">

                    <div class="campo">
                        <label>CEP*</label>
                        <input type="text" id="CEP" placeholder="Digite o CEP">
                    </div>

                    <div class="campo">
                        <Label>Logradouro* </Label>
                        <input type="text" id="Logradouro" placeholder="Digite o Logradouro"> 
                    </div>

                    <div class="campo">
                        <Label>Bairro* </Label>
                        <input type="text" id="Bairro" placeholder="Digite o Bairro"> 
                    </div>

                    <div class="campo">
                        <Label>Número* </Label>
                        <input type="text" id="numero" placeholder="Digite o Número"> 
                    </div>

                    <div class="campo">
                        <Label>Cidade* </Label>
                        <input type="text" id="cidade" placeholder="Digite a Cidade"> 
                    </div>

                    <div class="campo">
                        <label for="uf">UF *</label>
                        <select id="uf" name="uf" required>
                            <option value="" disabled selected>Selecione o estado</option>
                            <option value="AC">AC - Acre</option>
                            <option value="AL">AL - Alagoas</option>
                            <option value="AP">AP - Amapá</option>
                            <option value="AM">AM - Amazonas</option>
                            <option value="BA">BA - Bahia</option>
                            <option value="CE">CE - Ceará</option>
                            <option value="DF">DF - Distrito Federal</option>
                            <option value="ES">ES - Espírito Santo</option>
                            <option value="GO">GO - Goiás</option>
                            <option value="MA">MA - Maranhão</option>
                            <option value="MT">MT - Mato Grosso</option>
                            <option value="MS">MS - Mato Grosso do Sul</option>
                            <option value="MG">MG - Minas Gerais</option>
                            <option value="PA">PA - Pará</option>
                            <option value="PB">PB - Paraíba</option>
                            <option value="PR">PR - Paraná</option>
                            <option value="PE">PE - Pernambuco</option>
                            <option value="PI">PI - Piauí</option>
                            <option value="RJ">RJ - Rio de Janeiro</option>
                            <option value="RN">RN - Rio Grande do Norte</option>
                            <option value="RS">RS - Rio Grande do Sul</option>
                            <option value="RO">RO - Rondônia</option>
                            <option value="RR">RR - Roraima</option>
                            <option value="SC">SC - Santa Catarina</option>
                            <option value="SP">SP - São Paulo</option>
                            <option value="SE">SE - Sergipe</option>
                            <option value="TO">TO - Tocantins</option>
                    </select>
                </div>

                <div class="campo">
                    <Label>Telefone* </Label>
                    <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx">
                </div>

                <div class="campo">
                    <Label>E-mail </Label>
                    <input type="text" id="email" placeholder="Digite o E-mail">
                </div>

                <div class="campo">
                    <Label>Tipo de Atendimento* </Label>
                    <select id="atendimento">
                        <option value="" disabled selected>Tipo de Atendimento</option>
                        <option value="particular">Particular</option>
                        <option value="SUS">SUS</option>
                        <option value="convenio">Convênio Médico</option>
                    </select>
                </div>
                <div class="botoes">
                <button type="button" class="btn-cadastrar">
                    Cadastrar
                </button>
                </div>
                </div>
            </div>
        <div class="atendimento">
            <h2>Gestão de Atendimentos</h2>

            <table class="tabela">
                <tr>
                    <th>Nº Atendimento</th>
                    <th>Paciente</th>
                    <th>Situação</th>
                    <th>Ações</th>
                </tr>

            </table>

        </div>
        </div>

     </main>

     <script>
        function proximaEtapa(){
            document.getElementById("form1").style.display = "none";
            document.getElementById("form2").style.display = "block";
        }
     </script>

</body>
</html>
